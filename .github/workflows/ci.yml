name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies
        run: pnpm audit:prod

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Bundle Budget
        run: pnpm bundle:check

      - name: Supply Chain Metadata
        run: pnpm supply-chain:generate

      - name: Electron Preload Smoke
        run: xvfb-run -a pnpm test:electron

      - name: Electron Renderer Smoke
        run: xvfb-run -a pnpm test:renderer

      - name: Plugin SDK Package
        run: |
          pnpm --filter @devtoolbox/plugin-sdk build
          pnpm --filter @devtoolbox/plugin-sdk pack:check

      - name: Marketplace Typecheck
        run: pnpm -C marketplace typecheck

      - name: Marketplace Build and Bundle Budget
        run: pnpm -C marketplace build
