site_name: DevToolBox
site_url: https://dtb.256th.com
repo_url: https://github.com/XthingsJacobs/devToolBox
repo_name: XthingsJacobs/devToolBox

docs_dir: ../docs
site_dir: site

exclude_docs: |
  README.md

theme:
  name: material
  language: en
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest
    - search.highlight

plugins:
  - search
  - git-revision-date-localized:
      type: date

nav:
  - Home:
      - Docs Home: index.md
  - Users:
      - User Guide: users/guide.md
      - FAQ: users/faq.md
      - Support: governance/support.md
      - Security Policy: governance/security.md
  - Plugin Developers:
      - Plugin Dev Guide: plugin-dev/guide.md
      - Plugin SDK Contract: plugin-dev/sdk.md
      - Marketplace Packaging: plugin-dev/packaging.md
  - Core Developers:
      - Core Dev Guide: core-dev/guide.md
      - Installation (From Source): core-dev/installation-from-source.md
      - Architecture: core-dev/architecture.md
      - Codebase: core-dev/codebase.md
      - Built-in Modules: core-dev/built-in-modules.md
      - IPC API: core-dev/ipc-api.md
      - Module API: core-dev/module-api.md
      - UI Guidelines: core-dev/ui-guidelines.md
      - CLI: shared/cli.md
      - Troubleshooting: shared/troubleshooting.md
      - Docs Maintenance: core-dev/docs-readme.md
  - Governance:
      - Open Source: governance/open-source.md
      - Contributing: governance/contributing.md
      - Code of Conduct: governance/code-of-conduct.md
      - Security: governance/security.md
      - Support: governance/support.md
      - Roadmap: governance/roadmap.md
      - Changelog: governance/changelog.md
      - Notice: governance/notice.md
