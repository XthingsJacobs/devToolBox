site_name: DevToolBox
site_url: https://dtb.256th.com
repo_url: https://github.com/jacobs-256/devToolBox
repo_name: jacobs-256/devToolBox

docs_dir: ../docs
site_dir: site
exclude_docs: |
  zh-CN/README.md

theme:
  name: material
  language: en
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest
    - search.highlight

plugins:
  - search
  - git-revision-date-localized:
      type: date

nav:
  - English:
      - Home: index.md
      - Getting Started: getting-started.md
      - Development:
          - Architecture: development/architecture.md
          - Built-in Tools: development/tools.md
          - Marketplace Plugins: development/plugins.md
          - Plugin SDK Reference: development/plugin-sdk.md
          - Design System: development/design-system.md
      - Project:
          - Project and Community: project/governance.md
          - Changelog: project/changelog.md
          - Notice: project/notice.md
  - 简体中文:
      - 首页: zh-CN/index.md
      - 快速开始: zh-CN/getting-started.md
      - 开发:
          - 架构说明: zh-CN/development/architecture.md
          - 内置工具: zh-CN/development/tools.md
          - Marketplace 插件: zh-CN/development/plugins.md
          - 插件 SDK 参考: zh-CN/development/plugin-sdk.md
          - 设计系统: zh-CN/development/design-system.md
      - 项目:
          - 项目与社区: zh-CN/project/governance.md
          - 更新记录: zh-CN/project/changelog.md
          - 声明: zh-CN/project/notice.md
